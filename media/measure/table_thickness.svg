<rect x="12.00" y="398.00" width="676.00" height="80.00" rx="6.00" stroke="#ccc" stroke-width="1.00" fill="#fafafa"/>
<text x="24.0" y="420.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">在桌沿用外爪夹住桌面板的上下两面（先把底板拿开，只量桌面板）。卡尺张不够就用尺子。</text>
<text x="24.0" y="442.0" font-size="15" fill="#c62828" text-anchor="start" font-weight="normal">没有期望值，把读数告诉我。</text>
<text x="24.0" y="464.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">用途：选 G 型夹。夹子的开口要 ≥ T + 10（底板）+ 5。</text>
