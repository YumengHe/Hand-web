<text x="24.0" y="632.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">弯的地方。</text>
<text x="24.0" y="654.0" font-size="15" fill="#c62828" text-anchor="start" font-weight="normal">没有期望值，把读数 P 告诉我。</text>
<text x="24.0" y="676.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">插座在桌沿外面，下面是空的，插头多长都放得下。量它是为了确认插头藏在手腕后面、不进相</text>
<text x="24.0" y="698.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">机画面：60 以内都看不到。</text>
