<text x="24.0" y="440.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">把一颗官方 M6 螺丝从“朝手的那一面”穿进孔里，手指顶住螺丝头。翻过来，凸台朝上。</text>
<text x="24.0" y="462.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">卡尺尾端压在螺丝尖上，推出深度杆顶到螺丝旁边的大平面（别顶在圆凸台上）。</text>
<text x="24.0" y="484.0" font-size="15" fill="#c62828" text-anchor="start" font-weight="normal">读数应约 6.0（螺丝杆长 10 − 孔底剩下的厚度 4）。5 ~ 12 都能用。超出就把读数告诉我。</text>
