<text x="24.0" y="520.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">用卡尺上面那对小的“内爪”：伸进一个孔里，向外撑开，顶住孔壁，读数。</text>
<text x="24.0" y="542.0" font-size="15" fill="#c62828" text-anchor="start" font-weight="normal">读数应约 6.6（6.4 ~ 6.8 都正常）。这个数后面算孔距要用。</text>
<text x="24.0" y="564.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">四个孔随便量一个；轻轻晃一下卡尺，取最大的读数。</text>
