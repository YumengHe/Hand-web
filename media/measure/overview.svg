<text x="24.0" y="700.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">A 转接件（要先把手拆下来）：螺丝孔直径、对角孔距、相邻孔距、圆凸台直径和高度、螺丝露</text>
