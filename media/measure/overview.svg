<text x="24.0" y="744.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">B D405 相机：机身宽高厚、M3 螺孔孔距、螺孔到四条边、USB-C 口在哪面、顶面平不平。</text>
<text x="24.0" y="766.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">C 桌子：桌面厚度、桌沿下面的空间（决定买多大的 G 型夹，2 个，从桌子前沿夹住底板）。  </text>
<text x="24.0" y="788.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">D 铜螺母（买到后）：立柱正面 4 个 M6、侧面 2 个 M4。  E 手腕线插头的硬段长度。</text>
