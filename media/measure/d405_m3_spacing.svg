<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 584" width="700" height="584" font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','WenQuanYi Micro Hei',sans-serif">
<rect width="700" height="584" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="21" fill="#222" text-anchor="start" font-weight="bold">D405：背面两个 M3 螺孔的孔距</text>
<text x="20.0" y="54.0" font-size="15" fill="#555" text-anchor="start" font-weight="normal">从相机背后看（镜头朝离开你的方向，三脚架螺孔朝下）</text>
<rect x="20.00" y="70.00" width="14.00" height="14.00" rx="0.00" stroke="#1565c0" stroke-width="1.60" fill="#1565c0"/>
<text x="40.0" y="82.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">蓝 = 卡尺内爪（一只）</text>
<rect x="228.00" y="70.00" width="14.00" height="14.00" rx="0.00" stroke="#e65100" stroke-width="1.60" fill="#e65100"/>
<text x="248.0" y="82.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">橙 = 卡尺内爪（另一只）</text>
<rect x="190.40" y="115.40" width="319.20" height="319.20" rx="30.40" stroke="#222" stroke-width="2.00" fill="#f1f3f5"/>
<circle cx="274.00" cy="275.00" r="9.50" stroke="#222" stroke-width="1.50" fill="#fff"/>
<circle cx="274.00" cy="275.00" r="11.40" stroke="#777" stroke-width="0.80" fill="none" stroke-dasharray="3 2"/>
<circle cx="426.00" cy="275.00" r="9.50" stroke="#222" stroke-width="1.50" fill="#fff"/>
<circle cx="426.00" cy="275.00" r="11.40" stroke="#777" stroke-width="0.80" fill="none" stroke-dasharray="3 2"/>
<rect x="325.68" y="396.60" width="48.64" height="38.00" rx="0.00" stroke="#777" stroke-width="0.90" fill="none" stroke-dasharray="4 3"/>
<path d="M264.50 268.50 L264.50 281.50 L269.50 281.50 L269.50 268.50 Z" stroke="#1565c0" stroke-width="1.00" fill="#1565c0" stroke-linejoin="round" stroke-linecap="round" opacity="0.90"/>
<path d="M435.50 281.50 L435.50 268.50 L430.50 268.50 L430.50 281.50 Z" stroke="#e65100" stroke-width="1.00" fill="#e65100" stroke-linejoin="round" stroke-linecap="round" opacity="0.90"/>
<path d="M275.50 275.00 L424.50 275.00" stroke="#c62828" stroke-width="2.60" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M435.50 275.00 L422.50 280.00 L422.50 270.00 Z" stroke="#c62828" stroke-width="0.50" fill="#c62828" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M264.50 275.00 L277.50 280.00 L277.50 270.00 Z" stroke="#c62828" stroke-width="0.50" fill="#c62828" stroke-linejoin="round" stroke-linecap="round"/>
<text x="350.0" y="311.0" font-size="17" fill="#c62828" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">卡尺读数 ≈ 22.5</text>
<path d="M274.00 267.00 L274.00 209.00" stroke="#2e7d32" stroke-width="1.00" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M426.00 267.00 L426.00 209.00" stroke="#2e7d32" stroke-width="1.00" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M285.00 217.00 L415.00 217.00" stroke="#2e7d32" stroke-width="1.80" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<path d="M426.00 217.00 L413.00 222.00 L413.00 212.00 Z" stroke="#2e7d32" stroke-width="0.50" fill="#2e7d32" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M274.00 217.00 L287.00 222.00 L287.00 212.00 Z" stroke="#2e7d32" stroke-width="0.50" fill="#2e7d32" stroke-linejoin="round" stroke-linecap="round"/>
<text x="350.0" y="207.0" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="bold" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">孔距（孔心到孔心）= 20.0</text>
<text x="350.0" y="394.6" font-size="13" fill="#888" text-anchor="middle" font-weight="normal" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">三脚架螺孔（在底面）</text>
<rect x="12.00" y="448.00" width="676.00" height="124.00" rx="6.00" stroke="#ccc" stroke-width="1.00" fill="#fafafa"/>
<text x="24.0" y="470.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">先用内爪量一个螺孔的内径（约 2.5），再把两只内爪各伸进一个孔、向外撑开，量最远的孔壁</text>
<text x="24.0" y="492.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">到孔壁。</text>
<text x="24.0" y="514.0" font-size="15" fill="#c62828" text-anchor="start" font-weight="normal">读数应约 22.5。   换算：孔距 = 读数 − 单孔内径 = 22.5 − 2.5 = 20.0</text>
<text x="24.0" y="536.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">算出来的孔距在 19.7 ~ 20.3 之间都能装。爪尖轻轻顶住就行，别刮螺纹。超出就把读数告诉</text>
<text x="24.0" y="558.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">我。</text>
</svg>
